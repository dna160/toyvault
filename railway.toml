# Service: toyvault-api
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["packages/api/**", "packages/shared/**", "Dockerfile", "pnpm-lock.yaml", "railway.toml"]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
